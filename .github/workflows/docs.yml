name: Check docs build

# Deployment moved to Cloudflare Pages (project "kalayaan-cms"), which builds
# from this repo on push and, unlike GitHub Pages, exposes a deploy hook the
# CMS can call on publish. This workflow no longer deploys anything — it keeps
# the build honest on PRs, where Pages' own build wouldn't gate a merge.
#
# It runs the same command Pages runs, including the post-build SEO check, so a
# broken page fails here before it fails the deploy.

on:
  push:
    branches: [main]
    paths: ["docs-site/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs-site/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter kalayaan-docs build
      - run: node docs-site/scripts/check-seo.mjs
